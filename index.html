<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Team Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{color-scheme:light}
html,body{margin:0}
body{font-size:14px}
img{max-width:100%}
[hidden]{display:none!important}

/* Layout: sticky header with tabs, one working column (max 1080px); rows collapse to cards on phones. */
:root{
  --bg:#f4f6f5; --surface:#ffffff; --sunk:#eef1ef; --ink:#16201c; --muted:#5b6964; --line:#dbe2de;
  --accent:#1d6b57; --accent-ink:#ffffff; --accent-weak:#e1efe9;
  --warn:#9a5806; --warn-weak:#fbefdc; --danger:#a8322a; --danger-weak:#fbe7e5;
  --sans:"Instrument Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1412; --surface:#161d1a; --sunk:#121816; --ink:#e4ebe8; --muted:#97a6a0; --line:#28322e;
  --accent:#5ec2a0; --accent-ink:#0b1a14; --accent-weak:#1b2f28;
  --warn:#e3a64c; --warn-weak:#33281a; --danger:#ef7d72; --danger-weak:#3a1e1b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1412; --surface:#161d1a; --sunk:#121816; --ink:#e4ebe8; --muted:#97a6a0; --line:#28322e;
  --accent:#5ec2a0; --accent-ink:#0b1a14; --accent-weak:#1b2f28;
  --warn:#e3a64c; --warn-weak:#33281a; --danger:#ef7d72; --danger-weak:#3a1e1b; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:12px 4px}
.brand{font-weight:700;font-size:17px;letter-spacing:-.01em;display:flex;align-items:baseline;gap:8px}
.brand small{font-family:var(--mono);font-weight:400;font-size:11px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.who{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding-block:4px 0}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{flex:none;padding:9px 12px 10px;color:var(--muted);text-decoration:none;font-weight:500;border-bottom:2px solid transparent;white-space:nowrap;display:flex;gap:6px;align-items:center}
nav.tabs a:hover{color:var(--ink)}
nav.tabs a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
.count{font-family:var(--mono);font-size:11px;background:var(--warn-weak);color:var(--warn);border-radius:99px;padding:0 6px}
main{padding-block:20px 80px;display:grid;gap:18px}
h1{font-size:22px;margin:0;letter-spacing:-.015em;text-wrap:balance}
h2{font-size:16px;margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:2px 0 0;font-size:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.pad{padding:16px}
.label{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
button,.btn{font:inherit;font-size:14px;font-weight:500;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:6px;padding:7px 12px;cursor:pointer;line-height:1.2}
button:hover{border-color:var(--muted)}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button.primary:hover{filter:brightness(1.07)}
button.ghost{border-color:transparent;background:transparent;color:var(--muted)}
button.ghost:hover{color:var(--ink);background:var(--sunk)}
button.danger{color:var(--danger);border-color:var(--danger-weak)}
button:disabled{opacity:.5;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{font:inherit;font-size:14px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 9px;min-width:0}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-weak)}
textarea{resize:vertical;width:100%;line-height:1.4}
input[type=number]{font-family:var(--mono)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--sunk)}
.seg button{border:0;border-radius:0;background:transparent;color:var(--muted);padding:6px 12px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;border-radius:99px;padding:2px 9px;white-space:nowrap}
.chip.ok{background:var(--accent-weak);color:var(--accent)}
.chip.warn{background:var(--warn-weak);color:var(--warn)}
.chip.mute{background:var(--sunk);color:var(--muted)}
.people{display:flex;gap:6px;flex-wrap:wrap}
.people button{border-radius:99px;padding:5px 12px}
.people button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.weeknav{display:flex;align-items:center;gap:6px}
.weeknav .wk{font-weight:600;min-width:150px;text-align:center}
/* weekly log grid */
.log{overflow:hidden}
.lrow{display:grid;grid-template-columns:minmax(180px,1.3fr) 112px 150px 84px minmax(200px,2fr);gap:10px;align-items:start;padding:10px 14px;border-top:1px solid var(--line)}
.lrow.head{border-top:0;background:var(--sunk);padding-block:8px}
.log.total-mode .lrow{grid-template-columns:minmax(180px,1.3fr) 112px 150px minmax(200px,2fr)}
.log.total-mode .c-min{display:none}
.acct{font-weight:500;padding-top:6px;min-width:0;overflow-wrap:anywhere}
.acct .brandtag{font-family:var(--mono);font-size:11px;color:var(--muted);display:block;font-weight:400}
.c-min input{width:100%;text-align:right}
.c-thru input{width:100%}
.hint{font-size:12px;color:var(--muted);margin-top:3px}
.toggle{display:inline-flex;align-items:center;gap:6px;cursor:pointer;margin-top:4px;font-size:13px;user-select:none;border:1px solid var(--line);border-radius:99px;padding:3px 10px 3px 6px;background:var(--surface)}
.toggle .box{width:16px;height:16px;border-radius:4px;border:1.5px solid var(--muted);display:grid;place-items:center;font-size:11px;line-height:1}
.toggle.on{background:var(--accent-weak);border-color:transparent;color:var(--accent);font-weight:600}
.toggle.on .box{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.mlabel{display:none}
.lfoot{display:flex;gap:16px;align-items:center;flex-wrap:wrap;padding:14px;border-top:1px solid var(--line);background:var(--sunk)}
.big{font-family:var(--mono);font-size:22px;font-weight:500;font-variant-numeric:tabular-nums}
.status{font-size:12px;color:var(--muted);min-height:1em}
@media (max-width:760px){
  .lrow,.log.total-mode .lrow{grid-template-columns:1fr 1fr;gap:8px}
  .lrow.head{display:none}
  .acct{grid-column:1/-1;padding-top:0}
  .c-note{grid-column:1/-1}
  .c-setup{grid-column:1/-1}
  .mlabel{display:block}
  .weeknav .wk{min-width:0}
}
/* cards / lists */
.list{display:grid;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:8px;min-width:0}
.card.pinned{border-color:var(--accent)}
.meta{font-size:12px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.body{white-space:pre-wrap;overflow-wrap:anywhere}
.thumb{display:block;max-width:100%;width:auto;max-height:340px;border:1px solid var(--line);border-radius:6px;background:var(--sunk)}
.answer{background:var(--accent-weak);border-radius:6px;padding:10px 12px}
.answer .label{color:var(--accent)}
.grouphead{margin:10px 0 0}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:22px;color:var(--muted);text-align:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:2px}
.stat .who{margin:0;color:var(--ink);font-weight:600;font-size:15px}
.tblwrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-top:1px solid var(--line);vertical-align:top}
th{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:400;border-top:0;background:var(--sunk)}
td.r,th.r{text-align:right}
.form{display:grid;gap:10px}
.form .row > *{flex:1 1 160px}
.inline-confirm{display:inline-flex;gap:6px;align-items:center;font-size:13px}
.banner{border-radius:var(--r);padding:12px 14px;background:var(--warn-weak);color:var(--warn);font-size:14px}
.acclist{display:grid;gap:0}
.accitem{display:flex;gap:8px;align-items:center;padding:7px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.accitem:first-child{border-top:0}
.accitem .nm{flex:1 1 220px;min-width:0;overflow-wrap:anywhere}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;z-index:20;max-width:calc(100% - 32px);box-shadow:0 6px 24px rgba(0,0,0,.18)}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
@media (prefers-reduced-motion:no-preference){.card,.lrow{transition:background .15s}}

a{color:var(--accent)}
.login{display:grid;place-items:start center;padding-top:6vh}
.login form{width:100%;max-width:400px}
.overlay{position:fixed;inset:0;background:rgba(10,16,14,.45);display:grid;place-items:center;padding:16px;z-index:30}
.settings{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.setting{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:6px;padding:10px 12px;cursor:pointer}
.setting input{margin-top:3px;accent-color:var(--accent)}
.stat.mine{border-color:var(--accent)}
input:disabled,textarea:disabled,button:disabled{cursor:not-allowed}

</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="bar">
      <div class="brand"><span id="brandName">Team Tracker</span> <small>Account tracker</small></div>
      <div class="who" id="who"></div>
    </div>
    <nav class="tabs" id="tabs"></nav>
  </div>
</header>
<main class="wrap" id="main"><div class="empty">Loading…</div></main>
<div class="toast" id="toast" hidden></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
